<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>APT DATA — 표지 카드 샘플</title>
<style>
  @font-face {
    font-family: "Pretendard";
    font-weight: 45 920;
    font-style: normal;
    font-display: block;
    src: url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/PretendardVariable.woff2") format("woff2-variations");
  }

  :root {
    --cobalt: #004AAD;      /* 브랜드 베이스 (로고 색) */
    --cobalt-deep: #00327A; /* 깊이: 하단 출처 바 */
    --white: #FFFFFF;
    --mist: rgba(255,255,255,0.70); /* 보조 텍스트 */
    --mist-2: rgba(255,255,255,0.55);
    --amber: #FFC400;       /* 유일한 강조 — 히어로 축선/틱 */
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1080px; height: 1350px;
    background: var(--cobalt);
    font-family: "Pretendard", -apple-system, sans-serif;
    color: var(--white);
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "tnum";
    letter-spacing: -0.01em;
    overflow: hidden;
  }

  .card {
    width: 1080px; height: 1350px;
    position: relative;
    padding: 88px 76px 150px; /* 하단은 출처 바 영역 확보 → 히어로가 그 위에서 광학 중앙 */
    display: flex; flex-direction: column;
  }

  /* ── 상단: 필러 태그 + 브랜드 마크 ── */
  .top { display: flex; align-items: center; justify-content: space-between; }
  .eyebrow {
    display: flex; align-items: center; gap: 16px;
    font-size: 30px; font-weight: 700; color: var(--mist);
    letter-spacing: 0.02em;
  }
  .eyebrow .datamark {
    width: 22px; height: 22px; border-radius: 5px;
    background: var(--amber);
    box-shadow: 0 0 0 6px rgba(255,196,0,0.18);
  }
  .brand {
    display: flex; align-items: baseline; gap: 10px;
    font-size: 27px; font-weight: 800; color: var(--white);
    letter-spacing: -0.01em;
  }
  .brand .dot { color: var(--amber); }

  /* ── 히어로: 지배 숫자 1개 ── */
  .hero { margin-top: auto; margin-bottom: auto; }
  .number {
    font-size: 400px; font-weight: 900; line-height: 0.86;
    letter-spacing: -0.045em;
    font-variant-numeric: tabular-nums;
    display: flex; align-items: flex-end;
  }
  .number .unit {
    font-size: 168px; font-weight: 900; letter-spacing: -0.02em;
    margin-left: 6px; padding-bottom: 30px;
  }
  /* 시그니처: 히어로 숫자 아래 앰버 축선 + 틱 (측정된 값) */
  .axis {
    margin-top: 34px; position: relative;
    width: 320px; height: 9px; border-radius: 999px;
    background: var(--amber);
  }
  .axis::before {
    content: ""; position: absolute; left: 0; top: -18px;
    width: 9px; height: 27px; border-radius: 999px; background: var(--amber);
  }

  .headline {
    margin-top: 52px;
    font-size: 64px; font-weight: 900; line-height: 1.14;
    letter-spacing: -0.03em;
  }
  .sub {
    margin-top: 24px;
    font-size: 36px; font-weight: 600; color: var(--mist);
    letter-spacing: -0.02em;
  }

  /* ── 하단: 출처 바 + 워터마크 ── */
  .footer {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: var(--cobalt-deep);
    padding: 30px 76px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .source { font-size: 22px; font-weight: 500; color: var(--mist-2); letter-spacing: -0.01em; }
  .watermark { font-size: 26px; font-weight: 800; color: var(--white); }
</style>
</head>
<body>
  <div class="card">
    <div class="top">
      <div class="eyebrow"><span class="datamark"></span>서울 아파트 매매 · 평형 비중</div>
      <div class="brand">APT<span class="dot">·</span>DATA</div>
    </div>

    <div class="hero">
      <div class="number">43.1<span class="unit">%</span></div>
      <div class="axis"></div>
      <div class="headline">요즘 서울에서 제일 많이 팔린 건<br/>대형도 국민평형도 아닌 ‘소형’.</div>
      <div class="sub">전용 59㎡ 이하 · 매매 10건 중 4건</div>
    </div>

    <div class="footer">
      <div class="source">출처: APT DATA · 국토교통부 실거래가(서울 아파트 매매) 2025.7–2026.7 · 전용면적 기준</div>
      <div class="watermark">@apt.data</div>
    </div>
  </div>
</body>
</html>
