<!doctype html><html lang="ko"><head><meta charset="utf-8"/>
<style>
@font-face{font-family:"Pretendard";font-weight:45 920;font-style:normal;font-display:block;
 src:url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/PretendardVariable.woff2") format("woff2-variations");}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1080px;height:1350px;background:#004AAD;font-family:"Pretendard",-apple-system,sans-serif;
 color:#FFFFFF;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum";letter-spacing:-0.01em;overflow:hidden;}
.card{width:1080px;height:1350px;position:relative;overflow:hidden;}
.stage{position:absolute;top:0;left:0;right:0;padding:88px 76px 0;display:flex;flex-direction:column;}
.top{display:flex;align-items:center;justify-content:space-between;}
.eyebrow{display:flex;align-items:center;gap:16px;font-size:30px;font-weight:700;color:rgba(255,255,255,0.70);letter-spacing:0.02em;}
.eyebrow .dm{width:22px;height:22px;border-radius:5px;background:#FFC400;box-shadow:0 0 0 6px rgba(255,196,0,0.18);}
.brand{display:flex;align-items:baseline;gap:10px;font-size:27px;font-weight:800;color:#FFFFFF;}
.brand .dot{color:#FFC400;}
.axis{margin-top:30px;position:relative;width:300px;height:9px;border-radius:999px;background:#FFC400;}
.axis::before{content:"";position:absolute;left:0;top:-18px;width:9px;height:27px;border-radius:999px;background:#FFC400;}
.badge{display:inline-flex;align-items:center;gap:10px;margin-top:24px;padding:10px 20px;border-radius:999px;
 background:rgba(255,196,0,0.16);color:#FFC400;font-size:24px;font-weight:800;width:max-content;}
.kicker{font-size:40px;font-weight:800;color:#FFC400;letter-spacing:-0.02em;margin-bottom:18px;}
.number{font-size:400px;font-weight:900;line-height:0.86;letter-spacing:-0.045em;display:flex;align-items:flex-end;}
.number .u{font-size:168px;font-weight:900;margin-left:10px;padding-bottom:30px;}
.headline{font-size:62px;font-weight:900;line-height:1.13;letter-spacing:-0.03em;}
.sub{margin-top:24px;font-size:36px;font-weight:600;color:rgba(255,255,255,0.70);letter-spacing:-0.02em;}
.para{font-size:38px;font-weight:600;line-height:1.4;color:#FFFFFF;margin-top:22px;}
.rank{margin-top:48px;display:flex;flex-direction:column;gap:20px;}
.row{display:flex;align-items:center;gap:26px;}
.row .gu{width:118px;font-size:37px;font-weight:800;letter-spacing:-0.02em;}
.row .bw{flex:1;background:rgba(255,255,255,0.07);border-radius:999px;}
.row .bar{height:48px;border-radius:999px;background:#BFD3F0;min-width:44px;}
.row .val{width:158px;text-align:right;font-size:42px;font-weight:900;letter-spacing:-0.02em;}
.row.hl .gu,.row.hl .val{color:#FFC400;}
.row.hl .bar{background:#FFC400;}
.div{display:flex;align-items:center;gap:26px;}
.div .d{width:118px;text-align:center;font-size:40px;color:rgba(255,255,255,0.55);letter-spacing:0.25em;}
.div .l{flex:1;height:2px;background:rgba(255,255,255,0.14);}
.div .sp{width:158px;}
.callout{margin-top:44px;display:flex;align-items:center;gap:22px;font-size:38px;font-weight:700;}
.callout .tick{width:9px;height:46px;border-radius:999px;background:#FFC400;}
.callout b{color:#FFC400;font-weight:900;}
.footer{position:absolute;left:0;right:0;bottom:0;background:#003276;padding:30px 76px;
 display:flex;align-items:center;justify-content:space-between;z-index:2;}
.source{font-size:22px;font-weight:500;color:rgba(255,255,255,0.55);}
.watermark{font-size:26px;font-weight:800;color:#FFFFFF;}
</style></head><body>
<div class="card">
  <div class="stage" id="stage">
    <div class="top"><div class="eyebrow"><span class="dm"></span>신혼·초보 실전제도 · 청약</div>
      <div class="brand">APT<span class="dot">·</span>DATA</div></div>
    <div class="badge">⚠ 발행 전 확인 (정책·세율 최신 기준)</div>
    <div class="headline" style="margin-top:56px">‘청약’이 대체 뭐길래<br/>다들 통장을 들까?</div><div class="axis"></div>
    <div class="para">청약 = 새로 짓는 아파트를 ‘분양가’(대개 시세보다 쌈)에 살 기회를 추첨·점수로 받는 것.</div><div class="para">청약통장이 응모권. 신혼·무주택일수록 유리한 칸이 따로 있어요.</div>
  </div>
  <div class="footer" id="footer"><div class="source">출처: APT DATA · 국토교통부 실거래가(서울 아파트 매매) 2025.7–2026.7 · 24평 중위값</div><div class="watermark">@apt.data</div></div>
</div>
<script>window.addEventListener("load",function(){
  var s=document.getElementById("stage").getBoundingClientRect().bottom;
  var f=document.getElementById("footer").getBoundingClientRect().top;
  var el=document.documentElement;
  el.setAttribute("data-h",Math.round(s));
  el.setAttribute("data-of", s>f-8 ? "1":"0");  // 콘텐츠가 출처 바를 침범 = 오버플로우
});</script>
</body></html>
